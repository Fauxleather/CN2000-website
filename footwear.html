<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Footwear — CN2000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main id="main">
      <header class="page-hero">
        <p class="eyebrow">Category</p>
        <h1>Footwear</h1>
        <p>Footwear from noEmosen and DetW.</p>
      </header>
      <section class="section">
        <div class="grid">
          <a class="pcard" href="n03-hightop.html">
            <div class="pcard-media">
              <img src="studdedhightops.webp" alt="N03 studded patent high-top" />
            </div>
            <div class="pcard-meta">
              <span class="pcard-brand">noEmosen</span>
              <h3>N03 studded patent high-top</h3>
              <div class="pcard-row">
                <span>AUD 149</span>
                <span class="status">In Sydney</span>
              </div>
            </div>
          </a>
          <a class="pcard" href="pink_sneaker.html">
            <div class="pcard-media">
              <img src="pink_sneakers.webp" alt="DETW Basic retro canvas sneakers" />
            </div>
            <div class="pcard-meta">
              <span class="pcard-brand">DetW</span>
              <h3>DETW “Basic” retro canvas sneakers</h3>
              <div class="pcard-row">
                <span>AUD 120</span>
                <span class="status">Inbound China</span>
              </div>
            </div>
          </a>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="config.local.js"></script>
    <script src="catalogue.js"></script>
    <script src="app.js"></script>
  </body>
</html>
