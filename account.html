<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — CN2000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main id="main">
      <header class="page-hero">
        <p class="eyebrow">Account</p>
        <h1>Sign in</h1>
        <p>Prototype only — no real accounts or checkout.</p>
      </header>
      <section class="section">
        <form class="account-form" onsubmit="event.preventDefault(); this.querySelector('.status').textContent = 'Saved on this page only. Not a live login.';">
          <label>Email <input type="email" name="email" autocomplete="username" required /></label>
          <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="btn" type="submit">Sign in</button>
          <p class="status"></p>
        </form>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="config.local.js"></script>
    <script src="catalogue.js"></script>
    <script src="app.js"></script>
  </body>
</html>
