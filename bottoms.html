<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bottoms — CN2000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main id="main">
      <header class="page-hero">
        <p class="eyebrow">Category</p>
        <h1>Bottoms</h1>
        <p>Denim from noEmosen and DetW.</p>
      </header>
      <section class="section">
        <div class="grid">
          <a class="pcard" href="ice-jeans.html">
            <div class="pcard-media">
              <img src="waxedbluejeans.webp" alt="Ice-blue crack-wax micro-flare jean" />
            </div>
            <div class="pcard-meta">
              <span class="pcard-brand">noEmosen</span>
              <h3>Ice-blue crack-wax micro-flare jean</h3>
              <div class="pcard-row">
                <span>AUD 115</span>
                <span class="status">Inbound China</span>
              </div>
            </div>
          </a>
          <a class="pcard" href="twopiecejeans.html">
            <div class="pcard-media">
              <img src="twopiecejeans.webp" alt="Original silver-brushed jeans" />
            </div>
            <div class="pcard-meta">
              <span class="pcard-brand">DetW</span>
              <h3>Original “Silver-Brushed” jeans</h3>
              <div class="pcard-row">
                <span>AUD 85</span>
                <span class="status">Inbound China</span>
              </div>
            </div>
          </a>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="config.local.js"></script>
    <script src="catalogue.js"></script>
