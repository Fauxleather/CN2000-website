<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jackets — CN2000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main id="main">
      <header class="page-hero">
        <p class="eyebrow">Category</p>
        <h1>Jackets</h1>
        <p>Outer layers from noEmosen and DetW.</p>
      </header>
      <section class="section">
        <div class="grid">
          <a class="pcard" href="rudeleopard.html">
            <div class="pcard-media">
              <img src="leopardhoodie.webp" alt="RUDELeopard layered hoodie" />
            </div>
            <div class="pcard-meta">
              <span class="pcard-brand">noEmosen</span>
              <h3>RUDELeopard layered hoodie</h3>
              <div class="pcard-row">
                <span>AUD 89</span>

            <div class="pcard-meta">
              <span class="pcard-brand">noEmosen</span>

                <span>AUD 249</span>

          <a class="pcard" href="bluehoodie.html">
            <div class="pcard-media">

            </div>
            <div class="pcard-meta">
              <span class="pcard-brand">DetW</span>
              <h3>DETW “Swan” mint green embroidered zip-up hoodie</h3>
              <div class="pcard-row">
                <span>AUD 75</span>
                <span class="status">In Sydney</span>
              </div>
            </div>

        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="config.local.js"></script>
    <script src="catalogue.js"></script>
    <script src="app.js"></script>
